name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
      - name: Sync current NFL week
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          FUNCTION_URL="${SUPABASE_FUNCTION_URL:-https://picjogrcwpscjveyfmbr.supabase.co/functions/v1}"
          curl --fail-with-body --request POST "$FUNCTION_URL/sync-nfl" \
            --header "authorization: Bearer $SYNC_SECRET" \
            --header "content-type: application/json" \
            --data '{"source":"github-actions","mode":"current"}'
